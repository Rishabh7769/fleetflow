services:
  postgres:
    image: postgres:16

    container_name: fleetflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow123
      POSTGRES_DB: fleetflow

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: